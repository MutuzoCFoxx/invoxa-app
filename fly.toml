app = "invoxa-api"
primary_region = "jnb"

[build]

[env]
  DB_CONNECTION = "sqlite"
  DB_DATABASE = "/data/database.sqlite"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "invoxa_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
